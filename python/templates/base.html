<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}MinhaCaixa{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <style>
        body { background-color: #f5f6f8; }
        .navbar-brand { font-weight: 600; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        th { white-space: nowrap; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('clientes_listar') }}">MinhaCaixa</a>
            <div class="navbar-nav">
                <a class="nav-link {% if request.path.startswith('/clientes') %}active fw-bold text-white{% endif %}"
                   href="{{ url_for('clientes_listar') }}">Clientes</a>
                <a class="nav-link {% if request.path.startswith('/movimentos') %}active fw-bold text-white{% endif %}"
                   href="{{ url_for('movimentos_home') }}">Movimentos</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, msg in mensagens %}
                    <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                        {{ msg }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block conteudo %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
